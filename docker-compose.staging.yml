version: '3.8'

networks:
  jamia_staging_network:
    name: jamia_staging_network
    driver: bridge

services:
  db:
    image: postgres:16-alpine
    container_name: jamia_staging_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-jamia_staging_db}
      POSTGRES_USER: ${DB_USER:-jamia_staging_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jamia_staging_secret_pw_2026}
    volumes:
      - jamia_postgres_staging_data:/var/lib/postgresql/data
    networks:
      - jamia_staging_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jamia_staging_user} -d ${DB_NAME:-jamia_staging_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jamia_staging_redis
    restart: always
    volumes:
      - jamia_redis_staging_data:/data
    networks:
      - jamia_staging_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jamia_staging_backend
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 60
    volumes:
      - jamia_static_staging_volume:/app/staticfiles
      - jamia_media_staging_volume:/app/media
    env_file:
      - .env.staging
    networks:
      - jamia_staging_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/liveness/"]
      interval: 15s
      timeout: 5s
      retries: 3

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jamia_staging_celery
    restart: always
    command: celery -A config worker -l info --concurrency=2
    volumes:
      - jamia_media_staging_volume:/app/media
    env_file:
      - .env.staging
    networks:
      - jamia_staging_network
    depends_on:
      - backend
      - redis

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jamia_staging_celery_beat
    restart: always
    command: celery -A config beat -l info
    env_file:
      - .env.staging
    networks:
      - jamia_staging_network
    depends_on:
      - backend
      - redis

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: jamia_staging_web
    restart: always
    networks:
      - jamia_staging_network
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: jamia_staging_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - jamia_static_staging_volume:/app/staticfiles:ro
      - jamia_media_staging_volume:/app/media:ro
    networks:
      - jamia_staging_network
    depends_on:
      - backend
      - web

volumes:
  jamia_postgres_staging_data:
    name: jamia_postgres_staging_data
  jamia_redis_staging_data:
    name: jamia_redis_staging_data
  jamia_static_staging_volume:
    name: jamia_static_staging_volume
  jamia_media_staging_volume:
    name: jamia_media_staging_volume
